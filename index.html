function openPanel(nodeId) {
  const data = NODE_DETAILS[nodeId];
  if (!data) return;
  const panel = document.getElementById('sidepanel');
  const content = document.getElementById('sidepanel-content');

  let html = '';
  const tagBg = data.tagColor || data.color || '#58a6ff';
  html += `<div class="tag" style="background: ${tagBg}22; color: ${tagBg}; border: 1px solid ${tagBg}55;">${data.tag}</div>`;
  html += `<h2>${data.title}</h2>`;
  html += `<div class="desc">${data.desc}</div>`;

  if (data.sections && data.sections.length) {
    data.sections.forEach(sec => {
      html += `<div class="section-title">${sec.title}</div>`;
      if (sec.items) {
        html += '<div class="item-list">';
        sec.items.forEach(item => {
          html += `<div class="item" style="border-left-color: ${data.color || '#30363d'}"><div class="item-name">${item.name}</div><div class="item-tag">${item.tag}</div></div>`;
        });
        html += '</div>';
      }
      if (sec.combos) {
        sec.combos.forEach(combo => {
          html += `<div class="combo"><div class="combo-name">${combo.name}</div><div class="combo-desc">${combo.desc}</div></div>`;
        });
      }
    });
  }

  content.innerHTML = html;
  panel.classList.add('open');
}

function closePanel() {
  document.getElementById('sidepanel').classList.remove('open');
}

(function loadVisNetwork() {
  const sources = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://cdn.jsdelivr.net/npm/vis-network/standalone/umd/vis-network.min.js'
  ];
  let idx = 0;
  function tryNext() {
    if (idx >= sources.length) {
      const loading = document.getElementById('loading');
      loading.classList.add('error');
      loading.innerHTML = '<div class="msg">그래프 라이브러리를 불러올 수 없습니다.<br><br>인터넷 연결을 확인하거나 다른 브라우저로 열어보세요.</div><button class="retry-btn" onclick="location.reload()">다시 시도</button>';
      return;
    }
    const s = document.createElement('script');
    s.src = sources[idx];
    s.onload = function() {
      if (typeof vis !== 'undefined' && vis.Network) initGraph();
      else { idx++; tryNext(); }
    };
    s.onerror = function() { idx++; tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
})();
